name: Optimize Images to WebP

on:
  push:
    paths:
      - 'public/images/**/*.jpg'
      - 'public/images/**/*.jpeg'
      - 'public/images/**/*.png'
      - 'public/images/**/*.JPG'
      - 'public/images/**/*.JPEG'
      - 'public/images/**/*.PNG'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    name: Convert uploaded JPG/PNG to WebP
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Optimize images in public/images/
        run: node scripts/optimize-images.mjs

      - name: Commit and push optimized WebP images
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No image changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/images src/content
          git commit -m "chore(images): optimize uploaded images to WebP [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
